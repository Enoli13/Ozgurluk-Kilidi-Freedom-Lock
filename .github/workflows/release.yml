name: Release APK

on:
  push:
    tags:
      - "v*"
    branches:
      - main
    paths:
      - "app/build.gradle.kts"
      - ".github/release-notes.md"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Android SDK lisanslarını kabul et
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Sürümü belirle
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)"
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "APK_NAME=OzgurlukKilidi-$TAG.apk" >> "$GITHUB_ENV"

      - name: APK derle
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: APK'yı adlandır
        run: cp app/build/outputs/apk/debug/app-debug.apk "$APK_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: ${{ env.APK_NAME }}

      - name: Release oluştur / güncelle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Özgürlük Kilidi ${{ env.TAG }}
          body_path: .github/release-notes.md
          files: ${{ env.APK_NAME }}
